<div class="relative inline-block text-left ui-user-profile-menu-host">
  <!-- Trigger Button -->
  <button
    type="button"
    [attr.aria-expanded]="isOpen"
    [attr.aria-label]="ariaLabel"
    aria-haspopup="menu"
    (click)="toggle($event)"
    [class]="triggerButtonClass"
  >
    <ng-content select="[slot=trigger]">
      <!-- Avatar -->
      <div
        class="relative flex items-center justify-center w-8 h-8 rounded-full font-semibold text-xs tracking-wider text-white shadow-xs overflow-hidden flex-shrink-0"
        [ngClass]="avatarBgColor"
      >
        <img
          *ngIf="user?.avatarUrl"
          [src]="user?.avatarUrl"
          [alt]="displayName"
          class="w-full h-full object-cover"
        />
        <span *ngIf="!user?.avatarUrl" class="select-none">
          {{ initials }}
        </span>
      </div>

      <!-- Info -->
      <div
        *ngIf="!compact"
        class="hidden sm:flex flex-col items-start text-left min-w-0 max-w-[140px] md:max-w-[180px]"
      >
        <span class="truncate text-xs font-semibold text-white leading-tight w-full">
          {{ displayName }}
        </span>
        <span *ngIf="displayRole" class="truncate text-[10px] text-white/75 font-normal leading-tight w-full">
          {{ displayRole }}
        </span>
      </div>

      <span
        *ngIf="!compact"
        class="hidden sm:inline-flex text-white/80 transition-transform duration-200 ease-out"
        [class.rotate-180]="isOpen"
      >
        <ui-icon icon="@tui.chevron-down" size="xs" />
      </span>
    </ng-content>
  </button>

  <!-- Dropdown -->
  <div
    *ngIf="isOpen"
    role="menu"
    aria-orientation="vertical"
    [class]="panelClass"
    (click)="$event.stopPropagation()"
  >
    <ng-content select="[slot=header]">
      <div *ngIf="showHeader" class="px-3.5 py-3 rounded-xl bg-slate-50/80 border border-slate-100 flex items-center gap-3 mb-1.5">
        <!-- Avatar -->
        <div
          class="flex items-center justify-center w-11 h-11 rounded-full font-bold text-sm text-white shadow-sm overflow-hidden flex-shrink-0"
          [ngClass]="avatarBgColor"
        >
          <img
            *ngIf="user?.avatarUrl"
            [src]="user?.avatarUrl"
            [alt]="displayName"
            class="w-full h-full object-cover"
          />
          <span *ngIf="!user?.avatarUrl" class="select-none">
            {{ initials }}
          </span>
        </div>

        <!-- User Details -->
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-slate-800 truncate" [title]="displayName">
            {{ displayName }}
          </p>
          <p *ngIf="displayEmail" class="text-xs text-slate-500 truncate" [title]="displayEmail">
            {{ displayEmail }}
          </p>
          <p *ngIf="!displayEmail && displayUsername" class="text-xs text-slate-500 truncate">
            {{ displayUsername }}
          </p>
          <div *ngIf="displayRole" class="mt-1 flex items-center">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#0061A1]/10 text-[#0061A1] border border-[#0061A1]/20">
              {{ displayRole }}
            </span>
          </div>
        </div>
      </div>
    </ng-content>

    <!-- Menu Items -->
    <div class="space-y-0.5" role="none">
      <ng-container *ngFor="let item of visibleItems; let i = index">
        <!-- Divider -->
        <div *ngIf="item.divider" class="h-px bg-slate-100 my-1" role="separator"></div>

        <!-- Item -->
        <button
          *ngIf="!item.divider"
          type="button"
          role="menuitem"
          [disabled]="item.disabled"
          [class]="getItemClass(item)"
          (click)="handleItemClick(item, $event)"
        >
          <!-- Icon -->
          <span
            *ngIf="item.icon"
            class="w-4 h-4 flex items-center justify-center shrink-0"
            [class]="getItemIconClass(item)"
          >
            <ui-icon [icon]="item.icon" size="sm" />
          </span>

          <!-- Label -->
          <div class="flex flex-col min-w-0 flex-1 text-left" *ngIf="item.description; else simpleLabel">
            <span class="truncate leading-tight font-medium">{{ item.label }}</span>
            <span class="text-[10px] font-normal text-slate-400 leading-tight mt-0.5">{{ item.description }}</span>
          </div>

          <ng-template #simpleLabel>
            <span class="truncate flex-1 leading-tight">{{ item.label }}</span>
          </ng-template>

          <!-- Badge -->
          <ui-badge
            *ngIf="item.badge"
            [variant]="item.badgeVariant || 'neutral'"
            size="sm"
            class="shrink-0 ml-1.5"
          >
            {{ item.badge }}
          </ui-badge>
        </button>
      </ng-container>

      <!-- Extra Content-->
      <ng-content />

      <!-- Footer -->
      <ng-content select="[slot=footer]" />
    </div>
  </div>
</div>
