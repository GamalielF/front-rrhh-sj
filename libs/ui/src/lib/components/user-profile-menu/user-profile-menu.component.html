<div class="relative inline-block text-left ui-user-profile-menu-host">
  <!-- Trigger Button -->
  <button
    type="button"
    [attr.aria-expanded]="isOpen"
    [attr.aria-label]="ariaLabel"
    aria-haspopup="menu"
    (click)="toggle($event)"
    [class]="triggerButtonClass"
  >
    <ng-content select="[slot=trigger]">
      <ui-avatar-icon 
        [user]="user" 
        [bgColor]="avatarBgColor"
        [iconUrl]="user?.avatarUrl"
      />
      
      <!-- Info -->
      <div
        class="hidden sm:flex flex-col items-start text-left min-w-0 max-w-[180px] md:max-w-[260px]"
      >
        <span
          class="text-xs font-semibold text-white leading-tight w-full whitespace-normal break-words"
          [title]="fullName"
        >
          {{ triggerDisplayName }}
        </span>
        <span *ngIf="displayRole" class="text-[10px] text-white/75 font-normal leading-tight w-full whitespace-normal break-words">
          {{ displayRole }}
        </span>
      </div>

      <span
        class="hidden sm:inline-flex text-white/80 transition-transform duration-200 ease-out"
        [class.rotate-180]="isOpen"
      >
        <ui-icon icon="@tui.chevron-down" size="xs" />
      </span>
    </ng-content>
  </button>
  
  <!-- Dropdown -->
  <div
    *ngIf="isOpen"
    role="menu"
    aria-orientation="vertical"
    [class]="panelClass"
    (click)="$event.stopPropagation()"
  >
    <ng-content select="[slot=header]">
      <div class="px-3.5 py-3 rounded-xl bg-slate-50/80 border border-slate-100 flex items-start sm:items-center gap-3 mb-1.5">
        <div
          class="flex items-center justify-center w-11 h-11 rounded-full font-bold text-sm text-white shadow-sm overflow-hidden shrink-0 mt-0.5 sm:mt-0"
          [ngClass]="avatarBgColor"
        >
          <img
            *ngIf="user?.avatarUrl"
            [src]="user?.avatarUrl"
            [alt]="fullName"
            class="w-full h-full object-cover"
          />
          <span *ngIf="!user?.avatarUrl" class="select-none">
            {{ initials }}
          </span>
        </div>
        
        <!-- User Details -->
        <div class="flex-1 min-w-0">
          <p
            class="text-sm font-semibold text-slate-800 leading-snug whitespace-normal break-words"
            [title]="fullName"
          >
            {{ fullName }}
          </p>
          <p
            *ngIf="displayEmail"
            class="text-xs text-slate-500 mt-0.5 whitespace-normal break-all"
            [title]="displayEmail"
          >
            {{ displayEmail }}
          </p>
          <p
            *ngIf="!displayEmail && displayUsername"
            class="text-xs text-slate-500 mt-0.5 whitespace-normal break-words"
          >
            {{ displayUsername }}
          </p>
          <div *ngIf="displayRole" class="mt-1 flex items-center">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-[#0061A1]/10 text-[#0061A1] border border-[#0061A1]/20 max-w-full whitespace-normal break-words">
              {{ displayRole }}
            </span>
          </div>
        </div>
      </div>
    </ng-content>
    
    <!-- Menu Items -->
    <div class="space-y-0.5" role="none">
      <ng-container *ngFor="let item of visibleItems; let i = index">
        <!-- Divider -->
        <div *ngIf="item.divider" class="h-px bg-slate-100 my-1" role="separator"></div>
        
        <!-- Item -->
        <button
          *ngIf="!item.divider"
          type="button"
          role="menuitem"
          [disabled]="item.disabled"
          [class]="getItemClass(item)"
          (click)="handleItemClick(item, $event)"
        >
          <!-- Icon -->
          <span
            *ngIf="item.icon"
            class="w-4 h-4 flex items-center justify-center shrink-0"
            [class]="getItemIconClass(item)"
          >
            <ui-icon [icon]="item.icon" size="sm" />
          </span>

          <!-- Label -->
          <div class="flex flex-col min-w-0 flex-1 text-left" *ngIf="item.description; else simpleLabel">
            <span class="truncate leading-tight font-medium">{{ item.label }}</span>
            <span class="text-[10px] font-normal text-slate-400 leading-tight mt-0.5">{{ item.description }}</span>
          </div>

          <ng-template #simpleLabel>
            <span class="truncate flex-1 leading-tight">{{ item.label }}</span>
          </ng-template>

          <!-- Badge -->
          <ui-badge
            *ngIf="item.badge"
            [variant]="item.badgeVariant || 'neutral'"
            size="sm"
            class="shrink-0 ml-1.5"
          >
            {{ item.badge }}
          </ui-badge>
        </button>
      </ng-container>
      
      <!-- Extra Content-->
      <ng-content />
      
      <!-- Footer -->
      <ng-content select="[slot=footer]" />
    </div>
  </div>
</div>
