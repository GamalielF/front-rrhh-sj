<div class="relative inline-flex items-center" *ngIf="availableDefinitions.length > 0">
  <!-- Clickable Column Header -->
  <button
    type="button"
    class="inline-flex items-center gap-1 text-xs font-semibold uppercase tracking-wider text-left transition-colors cursor-pointer select-none focus:outline-none rounded hover:text-blue-600 group"
    [class.text-blue-600]="hasActiveFilter"
    [class.text-gray-500]="!hasActiveFilter"
    [title]="hasActiveFilter ? 'Filtros activos (' + columnActiveFilters.length + ') - Clic para configurar' : 'Clic para filtrar por ' + column.title"
    (click)="toggle($event)"
  >
    <ui-icon *ngIf="availableDefinitions.length > 0" [icon]="'chevron-down'" size="xs"/>
    <span>{{ column.title }}</span>
    <span
      *ngIf="columnActiveFilters.length > 1"
      class="inline-flex items-center justify-center min-w-[16px] h-4 px-1 rounded-full text-[10px] font-bold bg-blue-600 text-white leading-none"
    >{{ columnActiveFilters.length }}</span>
  </button>

  <!-- Popover Panel -->
  <div
    *ngIf="isOpen"
    [id]="'filter-popover-' + column.key"
    class="fixed z-[9999] w-72 rounded-xl bg-white p-3.5 shadow-2xl border border-gray-200 focus:outline-none animate-in fade-in zoom-in-95 duration-150 normal-case"
    [style.top.px]="popoverTop"
    [style.left.px]="popoverLeft"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between pb-2.5 border-b border-gray-100">
      <div class="flex items-center gap-1.5 text-xs font-semibold text-gray-800">
        <ui-icon icon="@tui.filter" size="xs" class="text-blue-600" />
        <span>{{ isEditing ? 'Editar Filtro' : 'Filtrar: ' + column.title }}</span>
      </div>
      <button
        type="button"
        class="text-gray-400 hover:text-gray-600 cursor-pointer p-0.5 rounded transition-colors"
        (click)="close()"
      >
        <ui-icon icon="@tui.x" size="xs" />
      </button>
    </div>

    <!-- Active Filters List on this column -->
    <div *ngIf="columnActiveFilters.length > 0" class="py-2 border-b border-gray-100 flex flex-col gap-1.5">
      <span class="text-[11px] font-medium text-gray-500 uppercase tracking-wider">Activos en esta columna:</span>
      <div
        *ngFor="let f of columnActiveFilters"
        class="flex flex-col gap-1.5 p-2 bg-gray-50 rounded-lg text-xs border border-gray-200 transition-all cursor-pointer hover:border-blue-300"
        [class.ring-2]="editingFilterId === f.id"
        [class.ring-blue-500]="editingFilterId === f.id"
        (click)="loadFilterForEdit(f)"
        title="Clic para editar este filtro"
      >
        <div class="flex items-center justify-between gap-1">
          <div class="flex items-center gap-1.5 truncate">
            <button
              type="button"
              class="w-3.5 h-3.5 rounded-full flex-shrink-0 cursor-pointer border border-black/20 hover:scale-125 transition-transform"
              [style.backgroundColor]="f.color || '#94A3B8'"
              [title]="'Cambiar color de resaltado (' + (f.color || 'sin color') + ')'"
              (click)="toggleQuickColorPicker(f.id, $event)"
            ></button>
            <span class="font-medium text-gray-700 truncate">{{ operatorLabels[f.operator] || f.operator }}:</span>
            <span class="text-gray-900 truncate font-semibold">
              {{ f.value }}{{ f.valueEnd ? ' - ' + f.valueEnd : '' }}
            </span>
          </div>

          <div class="flex items-center gap-1">
            <button
              type="button"
              class="text-gray-400 hover:text-blue-600 p-0.5 rounded cursor-pointer transition-colors"
              title="Editar filtro"
              (click)="$event.stopPropagation(); loadFilterForEdit(f)"
            >
              <ui-icon icon="@tui.pencil" size="xs" />
            </button>
            <button
              type="button"
              class="text-gray-400 hover:text-red-600 p-0.5 rounded cursor-pointer transition-colors"
              title="Eliminar filtro"
              (click)="removeFilter(f.id, $event)"
            >
              <ui-icon icon="@tui.trash-2" size="xs" />
            </button>
          </div>
        </div>

        <div *ngIf="column.allowColorHighlight && activeColorPickerFilterId === f.id" class="pt-1.5 border-t border-gray-200" (click)="$event.stopPropagation()">
          <ui-data-table-color-picker
            [selectedColor]="f.color"
            (colorChange)="updateActiveFilterColor(f, $event)"
          />
        </div>
      </div>
    </div>

    <!-- Filter Configuration / Edit Form -->
    <div class="flex flex-col gap-2.5 pt-2.5 text-left">
      <!-- Filter Definition selector (if multiple defined and not editing) -->
      <div *ngIf="availableDefinitions.length > 1 && !isEditing" class="flex flex-col gap-1">
        <label class="text-[11px] font-medium text-gray-500">Tipo de filtro</label>
        <select
          [ngModel]="selectedDefIndex"
          (ngModelChange)="onDefChange($event)"
          class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:border-blue-500 focus:outline-none"
        >
          <option *ngFor="let d of availableDefinitions; let i = index" [value]="i">
            {{ d.label || d.type }}
          </option>
        </select>
      </div>

      <!-- Operator selector -->
      <div *ngIf="availableOperators.length > 1" class="flex flex-col gap-1">
        <label class="text-[11px] font-medium text-gray-500">
          {{ currentDefinition?.type === 'sort' ? 'Dirección de orden' : 'Condición' }}
        </label>
        <select
          [(ngModel)]="operator"
          class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:border-blue-500 focus:outline-none"
        >
          <option *ngFor="let op of availableOperators" [value]="op">
            {{ operatorLabels[op] || op }}
          </option>
        </select>
      </div>

      <!-- Value Input based on definition type -->
      <div class="flex flex-col gap-1" *ngIf="currentDefinition && currentDefinition.type !== 'sort'">
        <label class="text-[11px] font-medium text-gray-500">{{ currentDefinition.texts?.valueLabel || 'Valor' }}</label>

        <!-- Text -->
        <input
          *ngIf="currentDefinition.type === 'text'"
          type="text"
          [(ngModel)]="value"
          [placeholder]="currentDefinition.texts?.placeholder || 'Valor a filtrar...'"
          class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:outline-none"
          (keydown.enter)="applyFilter()"
        />

        <!-- Number -->
        <input
          *ngIf="currentDefinition.type === 'number'"
          type="number"
          [(ngModel)]="value"
          [placeholder]="currentDefinition.texts?.placeholder || 'Valor numérico...'"
          class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:outline-none"
          (keydown.enter)="applyFilter()"
        />

        <!-- Number Range -->
        <div *ngIf="currentDefinition.type === 'number-range'" class="flex items-center gap-1.5">
          <input
            type="number"
            [(ngModel)]="value"
            [placeholder]="currentDefinition.texts?.placeholder || 'Mín'"
            class="w-1/2 text-xs px-2 py-1.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:outline-none"
          />
          <span class="text-xs text-gray-400">-</span>
          <input
            type="number"
            [(ngModel)]="valueEnd"
            [placeholder]="currentDefinition.texts?.placeholderEnd || 'Máx'"
            class="w-1/2 text-xs px-2 py-1.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:outline-none"
          />
        </div>

        <!-- Date -->
        <input
          *ngIf="currentDefinition.type === 'date'"
          type="date"
          [(ngModel)]="value"
          class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:outline-none"
        />

        <!-- Date Range -->
        <div *ngIf="currentDefinition.type === 'date-range'" class="flex flex-col gap-1">
          <input
            type="date"
            [(ngModel)]="value"
            class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:outline-none"
          />
          <input
            type="date"
            [(ngModel)]="valueEnd"
            class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:outline-none"
          />
        </div>

        <!-- Select Options -->
        <select
          *ngIf="currentDefinition.type === 'select'"
          [(ngModel)]="value"
          class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-200 bg-gray-50 focus:bg-white focus:border-blue-500 focus:outline-none"
        >
          <option value="">{{ currentDefinition.texts?.selectPlaceholder || 'Seleccionar opción...' }}</option>
          <option *ngFor="let opt of currentDefinition.options" [value]="opt.value">
            {{ opt.label }}
          </option>
        </select>

        <!-- Dropdown Range -->
        <div *ngIf="currentDefinition.type === 'dropdown-range'">
          <select
            *ngIf="currentDefinition.presetRanges?.length"
            class="w-full text-xs px-2.5 py-1.5 rounded-lg border bg-gray-50 focus:bg-white focus:outline-none cursor-pointer transition-colors"
            [class.border-blue-500]="selectedPresetIndex >= 0"
            [class.text-blue-700]="selectedPresetIndex >= 0"
            [class.border-gray-200]="selectedPresetIndex < 0"
            [ngModel]="selectedPresetIndex"
            (ngModelChange)="onPresetIndexChange($event, currentDefinition.presetRanges!)"
          >
            <option [value]="-1">{{ currentDefinition.texts?.selectPlaceholder || 'Seleccionar etapa...' }}</option>
            <option
              *ngFor="let preset of currentDefinition.presetRanges; let i = index"
              [value]="i"
            >{{ preset.label }} · {{ preset.min }} a {{ preset.max }} días</option>
          </select>
        </div>
      </div>

      <!-- Color Picker -->
      <div *ngIf="column.allowColorHighlight && currentDefinition?.type !== 'sort'">
        <ui-data-table-color-picker
          [selectedColor]="selectedColor"
          (colorChange)="onColorChange($event)"
        />
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-between gap-2 pt-1">
        <button
          *ngIf="isEditing"
          type="button"
          class="px-2.5 py-1 text-xs font-medium text-red-600 hover:text-red-700 rounded-lg hover:bg-red-50 cursor-pointer transition-colors"
          (click)="removeFilter(editingFilterId!)"
        >
          Eliminar
        </button>

        <div class="flex items-center gap-2 ml-auto">
          <button
            type="button"
            class="px-2.5 py-1 text-xs font-medium text-gray-600 hover:text-gray-800 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors"
            (click)="isEditing ? cancelEdit() : close()"
          >
            {{ isEditing ? 'Cancelar' : 'Cerrar' }}
          </button>
          <button
            type="button"
            class="px-3 py-1 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-lg shadow-xs cursor-pointer flex items-center gap-1 transition-colors"
            (click)="applyFilter()"
          >
            <ui-icon [icon]="isEditing ? '@tui.check' : '@tui.plus'" size="xs" />
            <span>
              {{ isEditing ? 'Guardar' : (canAddMore && currentDefActiveCount > 0 ? 'Agregar otro' : 'Aplicar') }}
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Non-filterable Column Header -->
<span *ngIf="!availableDefinitions || availableDefinitions.length === 0">
  {{ column.title }}
</span>
