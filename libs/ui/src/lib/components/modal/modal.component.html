<ng-container *ngIf="isOpen">
  <div
    class="fixed inset-0 z-40 bg-gray-900/40 backdrop-blur-xs transition-opacity"
    (click)="closeOnBackdrop && close.emit()"
    aria-hidden="true"
  ></div>

  <!-- Dialog -->
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6"
    role="dialog"
    [attr.aria-label]="title"
    aria-modal="true"
  >
    <!-- Modal panel -->
    <div [class]="panelClass">

      <!-- Header -->
      <div *ngIf="title || showClose"
        class="flex items-start justify-between gap-4 px-6 py-4.5 border-b border-gray-100">
        <div class="flex-1 min-w-0">
          <h2 *ngIf="title" class="text-base font-semibold text-gray-900 m-0 leading-snug">{{ title }}</h2>
          <p *ngIf="subtitle" class="text-xs text-gray-500 mt-1 m-0">{{ subtitle }}</p>
        </div>
        <button
          *ngIf="showClose"
          type="button"
          class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg
                 text-gray-400 hover:text-gray-700 hover:bg-gray-100
                 outline-none focus-visible:ring-2 focus-visible:ring-[#3B82F6]
                 transition-colors duration-150 cursor-pointer"
          (click)="close.emit()"
          aria-label="Cerrar modal"
        >
          <ui-icon icon="@tui.x" size="sm" />
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-5 overflow-y-auto flex-1">
        <ng-content />
      </div>

      <!-- Footer -->
      <div *ngIf="hasFooter"
        class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50/50">
        <ng-content select="[slot=footer]" />
      </div>

    </div>
  </div>
</ng-container>
