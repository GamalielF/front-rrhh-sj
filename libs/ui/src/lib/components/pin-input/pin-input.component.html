<div
  class="flex flex-col gap-2 w-full"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
>
  <!-- Label -->
  <label
    *ngIf="label"
    [for]="pinId + '-cell-0'"
    class="text-xs font-medium text-gray-700 flex items-center justify-center gap-1 text-center"
  >
    <span>{{ label }}</span>
    <span *ngIf="isRequired" class="text-red-500 font-medium" aria-hidden="true">*</span>
  </label>

  <!-- Cell container -->
  <div
    class="flex items-center justify-center gap-2 sm:gap-2.5 w-full py-0.5"
    [class.opacity-50]="isDisabled"
    [class.pointer-events-none]="isDisabled"
    (paste)="onPaste($event, 0)"
  >
    <ng-container *ngFor="let digit of digits; let i = index; trackBy: trackByIndex">
      <!-- Optional Separator Dot -->
      <div
        *ngIf="isSplitIndex(i)"
        class="w-1.5 h-1.5 bg-gray-300 rounded-full mx-0.5 select-none shrink-0"
        aria-hidden="true"
      ></div>

      <input
        #cellInput
        [id]="pinId + '-cell-' + i"
        [type]="getInputType()"
        [inputMode]="getInputMode()"
        autocomplete="one-time-code"
        maxlength="1"
        [placeholder]="placeholder"
        [value]="digit"
        [disabled]="isDisabled"
        [readonly]="readonly"
        [autofocus]="autofocus && i === 0"
        [attr.aria-label]="'Carácter ' + (i + 1) + ' de ' + length"
        [attr.aria-invalid]="hasError"
        [attr.aria-describedby]="hasError ? errorId : (hint ? hintId : null)"
        class="rounded-lg border text-center font-mono font-medium outline-none transition-colors duration-150 select-all"
        [class]="getCellClasses(i)"
        (input)="onInput($event, i)"
        (keydown)="onKeyDown($event, i)"
        (focus)="onCellFocus($event)"
      />
    </ng-container>
  </div>

  <!-- Hint -->
  <div class="text-center min-h-[1.25rem] flex items-center justify-center">
    <span *ngIf="hint && !hasError" [id]="hintId" class="text-xs text-gray-500">
      {{ hint }}
    </span>
    <span
      *ngIf="hasError"
      [id]="errorId"
      class="text-xs text-red-600 font-medium flex items-center justify-center gap-1"
      role="alert"
    >
      {{ currentErrorMessage }}
    </span>
  </div>
</div>
