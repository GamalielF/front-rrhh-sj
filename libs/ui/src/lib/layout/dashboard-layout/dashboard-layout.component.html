<!-- Root -->
<div
  class="flex h-screen w-screen overflow-hidden bg-slate-100 font-sans text-slate-800"
  [style.--sidebar-width]="sidebarWidthPx() + 'px'"
>

  <!-- SIDEBAR -->
  <div
    *ngIf="sidebarOpen()"
    class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-xs transition-opacity lg:hidden"
    (click)="closeMobileSidebar()"
    aria-hidden="true"
  ></div>

  <aside
    class="fixed top-0 bottom-0 left-0 z-50 flex flex-col bg-[#002e4f] text-white shadow-xl transition-all duration-300 ease-in-out"
    [style.width]="sidebarWidthPx() + 'px'"
    [ngClass]="{
      'translate-x-0': sidebarOpen(),
      '-translate-x-full lg:translate-x-0': !sidebarOpen()
    }"
  >
    <!-- Logo Header -->
    <div
      class="bg-[#002e4f] h-22 flex items-center border-b border-white/10 flex-shrink-0 transition-all duration-300 px-4 p-10 justify-center"
    >
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="rounded-lg p-1.5 flex items-center justify-center shadow-xs flex-shrink-0">
          <img
            *ngIf="logoSrc && !sidebarCollapsed()"
            [src]="logoSrc"
            [alt]="appTitle || 'Logo'"
            class="h-10 md:h-13 w-auto object-contain"
          />
          <img
            *ngIf="logoCompactSrc && sidebarCollapsed()"
            [src]="logoCompactSrc"
            [alt]="appTitle || 'Logo'"
            class="h-10 md:h-13 w-auto object-contain"
          />
        </div>
        
      </div>
    </div>

    <!-- Navigation List -->
    <nav class="flex-1 py-4 px-2.5 overflow-y-auto overflow-x-hidden space-y-1" aria-label="Menú principal">
      <ul class="flex flex-col gap-1" role="list">
        <li *ngFor="let item of navItems" role="listitem">
          <button
            type="button"
            [ngClass]="isActive(item)
              ? 'bg-[#0061A1] text-white font-semibold shadow-md shadow-[#0061A1]/30 ring-1 ring-sky-400/30'
              : 'text-slate-300 hover:text-white hover:bg-white/10 font-medium'"
            class="w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl text-sm transition-all duration-150 cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
            (click)="onNavClick(item)"
            [attr.aria-current]="isActive(item) ? 'page' : null"
            [title]="sidebarCollapsed() ? item.label : ''"
          >
            <!-- Icon Container with active accent -->
            <span
              class="w-6 h-6 flex items-center justify-center flex-shrink-0 transition-transform duration-150"
              [class.scale-110]="isActive(item)"
            >
              <ui-icon [icon]="item.icon" size="sm" />
            </span>

            <!-- Label and Badge -->
            <ng-container *ngIf="!sidebarCollapsed()">
              <span class="flex-1 text-left truncate tracking-tight text-[15.5px]">{{ item.label }}</span>
              <span
                *ngIf="item.badge"
                class="flex-shrink-0 text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/20 text-white leading-none shadow-xs"
              >{{ item.badge }}</span>
            </ng-container>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Sidebar Footer -->
    <div class="border-t border-white/10 p-2.5 flex-shrink-0">
      <button
        type="button"
        class="w-full flex items-center justify-center gap-2.5 h-9 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-white/10 transition-colors cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
        (click)="toggleCollapse()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
      >
        <ui-icon [icon]="sidebarCollapsed() ? '@tui.chevrons-right' : '@tui.chevrons-left'" size="sm" />
        <span *ngIf="!sidebarCollapsed()" class="truncate">Contraer menú</span>
      </button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div
    class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden transition-all duration-300 ease-in-out lg:pl-[var(--sidebar-width)]"
  >

    <!-- Topbar -->
    <header class="h-24 sm:h-24 bg-[#002e4f] text-white flex-shrink-0 sticky top-0 z-30 shadow-sm border-b border-[#004a7c] flex items-center justify-between px-4 sm:px-6">
      
      <div class="flex items-center gap-3 min-w-0">
        <img
          *ngIf="logoSrc"
          [src]="logoSrc"
          [alt]="appTitle || 'Logo'"
          class="h-14 sm:h-16 w-auto object-contain lg:hidden"
        />

        <div class="hidden lg:flex items-center gap-2">
          <span *ngIf="showTitle && appTitle" class="font-semibold text-sm text-white/90 tracking-tight">
            {{ appTitle }}
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
        <button
          type="button"
          class="lg:hidden inline-flex items-center justify-center w-9 h-9 rounded-lg text-white hover:bg-white/10 transition-colors cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-white/40"
          (click)="toggleMobileSidebar()"
          aria-label="Abrir menú"
        >
          <ui-icon icon="@tui.menu" size="md" />
        </button>

        <!-- Actions -->
        <ng-content select="[slot=topbar-actions]" />
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 min-w-0 overflow-y-auto bg-[#f8fafc] flex flex-col">
      <div class="flex-1 max-w-[1440px] w-full mx-auto p-4 sm:p-6 lg:p-8">
        <ng-content />
      </div>
    </main>

  </div>

</div>
