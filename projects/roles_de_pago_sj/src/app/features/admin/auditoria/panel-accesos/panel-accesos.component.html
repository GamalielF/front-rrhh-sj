<ui-card title="Accesos a roles de pago" subtitle="Cada consulta de un rol, permitida o denegada">
  <div class="flex flex-col gap-4">
    @if (error()) {
      <app-aviso variante="danger">{{ error() }}</app-aviso>
    }
    @if (aviso()) {
      <app-aviso [variante]="truncado() ? 'warning' : 'success'">{{ aviso() }}</app-aviso>
    }

    <ui-table
      [columns]="columnas"
      [data]="filas()"
      [loading]="cargando()"
      trackByKey="id"
      emptyMessage="No hay accesos en el rango elegido"
    />
    <ui-pagination
      [page]="pagina()"
      [pageSize]="tamano()"
      [total]="total()"
      [disabled]="cargando()"
      (pageChange)="cambiarPagina($event)"
      (pageSizeChange)="cambiarTamano($event)"
    />
    <div>
      <ui-button variant="outline" icon="@tui.download" [loading]="exportando()" (onClick)="exportar()">
        Exportar a CSV
      </ui-button>
    </div>
  </div>
</ui-card>
