<ui-page-container
  title="Test"
  description="aaaaa"
  icon="@tui.info"
>
  <div slot="actions" class="flex items-center gap-3 flex-wrap">
    <ui-link
      routerLink="/test/detalle"
      icon="@tui.arrow-right"
      iconPosition="left"
      size="sm"
    >
      Ir a hola 1
    </ui-link>
    <ui-button
      variant="secondary"
      size="sm"
      icon="@tui.rotate-ccw"
      (onClick)="onSecondaryAction()"
    >
      Second
    </ui-button>
    <ui-button
      variant="brand"
      size="sm"
      icon="@tui.plus"
      (onClick)="onPrimaryAction()"
    >
      First
    </ui-button>
  </div>

  <ui-grid [cols]="1" [colsLg]="3" gap="lg">
    <ui-grid-item [flex]="true" gap="md">
      <ui-card title="Form">
        <ui-form [formGroup]="testForm" (formSubmit)="onPrimaryAction()" customClass="flex flex-col gap-4">
          <ui-input
            type="text"
            label="Cédula"
            formControlName="cedula"
            placeholder="10 dígitos"
            prefixIcon="@tui.credit-card"
          />

          <ui-input
            type="number"
            label="Monto"
            formControlName="monto"
            placeholder="0"
            prefixIcon="@tui.dollar-sign"
          />

          <div class="flex items-center gap-2 pt-1">
            <ui-button type="submit" variant="brand" size="sm" icon="@tui.check">
              Guardar
            </ui-button>
            <ui-button type="button" variant="secondary" size="sm" (onClick)="onSecondaryAction()">
              Limpiar
            </ui-button>
          </div>
        </ui-form>
      </ui-card>

      <!-- Botones -->
      <ui-card title="Botones">
        <div class="flex flex-col gap-4">
          <div>
            <span class="text-xs font-medium text-gray-500 mb-2 block">Variantes</span>
            <div class="flex flex-wrap gap-2">
              <ui-button variant="brand" size="sm">Brand</ui-button>
              <ui-button variant="primary" size="sm">Primary</ui-button>
              <ui-button variant="secondary" size="sm">Secondary</ui-button>
              <ui-button variant="outline" size="sm">Outline</ui-button>
              <ui-button variant="ghost" size="sm">Ghost</ui-button>
              <ui-button variant="success" size="sm" icon="@tui.check">Success</ui-button>
              <ui-button variant="danger" size="sm" icon="@tui.trash-2">Danger</ui-button>
            </div>
          </div>

          <div>
            <span class="text-xs font-medium text-gray-500 mb-2 block">Tamaños y estados</span>
            <div class="flex flex-wrap items-center gap-2">
              <ui-button variant="brand" size="xs">XS</ui-button>
              <ui-button variant="brand" size="sm">SM</ui-button>
              <ui-button variant="brand" size="md">MD</ui-button>
              <ui-button variant="secondary" size="sm" [disabled]="true">Disabled</ui-button>
            </div>
          </div>
        </div>
      </ui-card>
    </ui-grid-item>

    <!-- Main-->
    <ui-grid-item [colSpanLg]="2" [flex]="true" gap="md">
      <ui-grid [cols]="2" [colsSm]="3" gap="md">
        <ui-kpi-card
          label="A"
          value="Some val"
          icon="@tui.chart-column"
          accentColor="blue"
        />
        <ui-kpi-card
          label="B"
          value="Somee val"
          icon="@tui.trending-up"
          accentColor="blue"
        />
        <ui-kpi-card
          label="C"
          value="0%"
          icon="@tui.circle-check"
          accentColor="blue"
        />
      </ui-grid>

      <!-- Table Card -->
      <ui-card title="Table" [noPadding]="true" [fullHeight]="true">
        <div slot="header-actions" class="text-xs text-gray-400 font-medium">
          {{ demoData.length }}
        </div>
        <ui-table
          [columns]="columns"
          [data]="demoData"
          [fullHeight]="true"
          trackByKey="id"
          emptyMessage="No hay datos registrados"
        />
      </ui-card>
    </ui-grid-item>
  </ui-grid>

  <!-- Data Table -->
  <ui-grid [cols]="1">
    <ui-grid-item>
      <ui-data-table
        [columns]="dataTableColumns"
        [data]="dataTableResponse"
        [page]="page"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20]"
        trackByKey="id"
        emptyMessage="No hay datos registrados"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (stateChange)="onStateChange($event)"
      />
    </ui-grid-item>
  </ui-grid>
</ui-page-container>
