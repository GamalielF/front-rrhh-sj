<ui-page-container title="Inicio" description="Roles de pago de COOPSANJOSE LTDA">
  <div class="flex flex-col gap-4">
    <app-rol-reciente />

    @if (esGestor()) {
      <app-estado-periodo />
    }

    @if (esAdmin()) {
      <app-alertas-admin />
    }

    @if (accesos().length > 0) {
      <app-accesos-rapidos [accesos]="accesos()" />
    }
  </div>
</ui-page-container>
