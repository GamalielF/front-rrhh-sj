<ui-modal [isOpen]="abierta()" [title]="titulo()" [subtitle]="subtitulo()" size="sm" (close)="cancelar.emit()">
  <div class="flex flex-col gap-3">
    <p class="m-0 text-sm text-gray-700">{{ mensaje() }}</p>
    @if (error()) {
      <app-aviso variante="danger">{{ error() }}</app-aviso>
    }
  </div>
  <div slot="footer" class="flex justify-end gap-2">
    <ui-button variant="ghost" [disabled]="procesando()" (onClick)="cancelar.emit()">Cancelar</ui-button>
    <ui-button [variant]="peligro() ? 'danger' : 'brand'" [loading]="procesando()" (onClick)="confirmar.emit()">
      {{ etiquetaConfirmar() }}
    </ui-button>
  </div>
</ui-modal>
