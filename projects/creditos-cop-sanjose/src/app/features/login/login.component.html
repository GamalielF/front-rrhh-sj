<div class="min-h-screen flex items-center justify-center bg-gray-200 p-4">

  <div class="w-full max-w-[860px] rounded-2xl overflow-hidden shadow-lg border border-gray-200 flex flex-col md:flex-row min-h-[480px]">

    <!-- ─ Left brand panel ─ -->

    <div
      class="flex flex-col justify-between bg-gradient-to-br from-[#0061A1] via-[#004e82] to-[#00385c] md:w-5/12"
      aria-hidden="true"
    >
      <div class="flex-[6] p-10 flex flex-col justify-center bg-[#0061A1]">
        <h1 class="text-2xl font-bold leading-tight text-white m-0">
          Sistema de Notificación<br>de Morosidad
        </h1>
      </div>

      <div class="hidden md:block flex-1 p-10 flex flex-col justify-center bg-[#003358]">
        <p class="text-sm leading-relaxed" style="color: rgba(186,210,255,0.8);">
          Notifica los créditos en mora a socios, garantes y asesores.
        </p>
      </div>
    </div>

    <!-- ─ Right form panel ─ -->
    <div class="flex-1 bg-white flex items-center justify-center p-8 sm:p-10">
      <div class="w-full max-w-sm flex flex-col gap-5">

        <div class="flex justify-start mb-1">
          <img src="/logo-blue.png" alt="Logo COP San José" class="h-11 w-auto object-contain" />
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>

          <ui-input
            label="Usuario"
            placeholder="usuario.sanjose"
            prefixIcon="@tui.user"
            formControlName="usuario"
            [errorMessage]="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched
              ? 'Requerido' : ''"
          />

          <ui-input
            type="password"
            label="Contraseña"
            placeholder="••••••••"
            prefixIcon="@tui.lock"
            formControlName="contrasenia"
            [errorMessage]="loginForm.get('contrasenia')?.invalid && loginForm.get('contrasenia')?.touched
              ? 'Requerida' : ''"
          />

          <div
            *ngIf="errorMessage"
            class="flex items-center gap-2 p-3 rounded-lg bg-red-50 border border-red-200 text-[#991B1B] text-xs"
            role="alert"
          >
            <ui-icon icon="@tui.circle-alert" size="sm" />
            <span>{{ errorMessage }}</span>
          </div>

          <ui-button
            type="submit"
            variant="brand"
            size="lg"
            [loading]="isLoading"
            style="width: 100%"
          >
            Iniciar Sesión
          </ui-button>

        </form>
      </div>
    </div>

  </div>

</div>
