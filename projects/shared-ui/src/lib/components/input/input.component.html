<div class="flex flex-col gap-1.5">
  <label *ngIf="label" [for]="inputId" class="text-xs font-medium text-gray-700 flex items-center gap-1">
    <span>{{ label }}</span>
    <span *ngIf="isRequired" class="text-[#DC2626] font-semibold" aria-hidden="true">*</span>
  </label>

  <div
    class="relative flex items-center"
    [class.opacity-50]="isDisabled"
    [class.pointer-events-none]="isDisabled"
  >
    <!-- Prefix icon -->
    <span *ngIf="prefixIcon"
      class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none z-10">
      <ui-icon [icon]="prefixIcon" size="sm" />
    </span>

    <input
      [id]="inputId"
      [type]="type"
      [placeholder]="placeholder"
      [disabled]="isDisabled"
      [readonly]="readonly"
      [min]="min"
      [max]="max"
      [step]="step"
      [value]="innerValue"
      [attr.aria-invalid]="hasError"
      [attr.aria-describedby]="hasError ? errorId : (hint ? hintId : null)"
      class="w-full rounded-lg border bg-white text-sm text-gray-900 placeholder:text-gray-400
             transition-all duration-150 outline-none"
      [class]="inputClasses"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    
    <!-- Suffix icon -->
    <span *ngIf="suffixIcon"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none z-10">
      <ui-icon [icon]="suffixIcon" size="sm" />
    </span>
  </div>

  <span *ngIf="hint && !hasError" [id]="hintId" class="text-xs text-gray-500">{{ hint }}</span>
  <span *ngIf="hasError" [id]="errorId" class="text-xs text-[#DC2626] font-medium" role="alert">{{ currentErrorMessage }}</span>
</div>
