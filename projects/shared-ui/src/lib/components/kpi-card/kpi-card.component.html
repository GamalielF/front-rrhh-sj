<div class="bg-white rounded-xl border border-gray-200 shadow-xs hover:shadow-sm transition-all duration-200 p-6 flex flex-col justify-between gap-4 h-full relative overflow-hidden group">
  <!-- Top decorative subtle indicator -->
  <div class="flex items-start justify-between gap-4">
    <div class="flex flex-col gap-1 min-w-0">
      <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider leading-tight">
        {{ label }}
      </span>
      <div class="text-2xl font-bold text-gray-900 tracking-tight leading-none mt-1">
        {{ value }}
      </div>
    </div>

    <!-- Icon Container -->
    <div *ngIf="icon" class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0 transition-transform duration-200 group-hover:scale-105" [class]="iconContainerClass">
      <ui-icon [icon]="icon" size="md" />
    </div>
  </div>

  <!-- Description -->
  <div *ngIf="trend || description" class="flex items-center justify-between gap-2 pt-3 border-t border-gray-100 text-xs">
    <div *ngIf="trend" class="inline-flex items-center gap-1 font-medium px-2 py-0.5 rounded-full"
         [class]="trend.direction === 'up' ? 'bg-emerald-50 text-[#065F46]' : 'bg-red-50 text-[#991B1B]'">
      <ui-icon [icon]="trend.direction === 'up' ? '@tui.arrow-up-right' : '@tui.arrow-down-right'" size="xs" />
      <span>{{ trend.value }}%</span>
    </div>

    <span *ngIf="trend?.label" class="text-gray-500 truncate">
      {{ trend?.label }}
    </span>

    <span *ngIf="description && !trend" class="text-gray-500 truncate">
      {{ description }}
    </span>
  </div>
</div>
