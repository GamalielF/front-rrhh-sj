<header class="h-16 bg-[#002e4f] flex-shrink-0 border-b border-[#0061A1]/20 shadow-sm sticky top-0 z-40">
  <div class="h-full max-w-[1440px] mx-auto flex items-center justify-between gap-4 pr-4 sm:pr-6">

    <!-- Brand area -->
    <div class="flex items-center flex-shrink-0" style="width:220px">
      <div class="flex items-center gap-2.5 px-4 py-1">
        <img
          *ngIf="logoSrc"
          [src]="logoSrc"
          [alt]="appTitle ? appTitle + ' logo' : 'Logo'"
          class="h-9 w-auto object-contain"
        />
        <span *ngIf="appTitle && showTitle"
          class="text-slate-800 font-semibold text-sm tracking-tight hidden sm:block">
          {{ appTitle }}
        </span>
      </div>
    </div>

    <!-- Center slot -->
    <div class="flex-1 min-w-0 flex justify-center">
      <ng-content select="[slot=center]" />
    </div>

    <!-- Actions slot -->
    <div class="flex items-center gap-2 flex-shrink-0">
      <ng-content select="[slot=actions]" />
      <ng-content />
    </div>

  </div>
</header>
