<div class="flex flex-col min-h-screen bg-[#f9fafb]">

  <!-- Topbar -->
  <ui-topbar [logoSrc]="logoSrc" [appTitle]="appTitle" [showTitle]="showTitle">
    <ng-content select="[slot=topbar-center]" slot="center" />
    <ng-content select="[slot=topbar-actions]" slot="actions" />
  </ui-topbar>

  <!-- Body -->
  <div class="flex flex-1 min-h-0">

    <!-- Optional sidebar -->
    <aside *ngIf="hasSidebar" class="w-64 flex-shrink-0 bg-white border-r border-gray-200 overflow-y-auto">
      <ng-content select="[slot=sidebar]" />
    </aside>

    <!-- Main content area -->
    <main class="flex-1 min-w-0 overflow-y-auto">
      <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <ng-content />
      </div>
    </main>

  </div>

  <!-- Optional footer -->
  <footer *ngIf="hasFooter"
    class="border-t border-gray-200 bg-white px-8 py-4 flex items-center justify-center text-xs text-gray-500">
    <ng-content select="[slot=footer]" />
  </footer>

</div>
