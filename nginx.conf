# Sirve el front compilado (archivos estáticos) bajo /roles-de-pago/. Traefik envía aquí las peticiones SIN quitar el prefijo,
# por eso los archivos están en una carpeta con el mismo nombre (ver el Dockerfile).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Detrás de Traefik este contenedor no conoce el servidor ni el puerto públicos: las redirecciones deben ser RELATIVAS (/roles-de-pago/)
    # y no http://servidor:8080/..., que el navegador no podría abrir.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad básicas. Las directivas "expires" de abajo NO las pisan (a diferencia de otro add_header en un location).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Para comprobar que el contenedor vive (no pasa por Traefik)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = / {
        return 404;
    }

    location = /roles-de-pago {
        return 301 /roles-de-pago/;
    }

    # El HTML nunca se guarda en caché: así cada despliegue se ve de inmediato
    location = /roles-de-pago/index.html {
        expires -1;
    }

    # Archivos con huella en el nombre (main-AB12CD34.js, chunk-..., styles-...): cambian en cada compilación, se guardan un año
    # (la expresión va entre comillas: sin ellas nginx toma las llaves {8} por el inicio de un bloque y no arranca)
    location ~ "^/roles-de-pago/.+-[A-Za-z0-9_]{8}\.(js|css)$" {
        try_files $uri =404;
        expires 1y;
    }

    # El resto de archivos (imágenes, fuentes, iconos): una hora. Si no existen, 404 de verdad, NO la página de inicio
    location ~* ^/roles-de-pago/.+\.(js|css|map|json|txt|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot|pdf)$ {
        try_files $uri =404;
        expires 1h;
    }

    # Cualquier otra ruta es una pantalla de la aplicación Angular (por ejemplo /roles-de-pago/rrhh/periodos): se entrega index.html
    location /roles-de-pago/ {
        try_files $uri $uri/ /roles-de-pago/index.html;
    }
}
